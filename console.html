<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

<body class="console-page">
<div class="console" id="console">
  <header class="console-header">
    <a class="console-brand" href="index.html#overview" aria-label="Tubecast overview"><span>TUBECAST</span><small>London delay forecast</small></a>
    <form class="console-route" id="route-form">
      <label><small>From</small><input id="route-from" list="stations" value="Stratford" autocomplete="off"></label>
      <span aria-hidden="true">→</span>
      <label><small>To</small><input id="route-to" list="stations" value="White City" autocomplete="off"></label>
      <datalist id="stations"></datalist>
      <button class="btn-p" type="submit">Check route</button>
      <p class="console-route-error" id="route-error" role="alert" aria-live="polite"></p>
    </form>
    <div class="console-meta"><span class="delay-dot now good" aria-hidden="true"></span><b id="console-time">08:43</b><small id="console-updated">Updated just now</small><a href="about.html">How it works</a></div>
  </header>

  <aside class="card console-panel console-left" aria-label="Current service overview">
    <div class="console-scroll">
      <section class="console-summary" id="console-summary"></section>
      <section class="console-section"><div class="console-section-head"><span>DELAYS NOW</span><b id="now-count">0</b></div><p>Observed station and direction reports</p><div class="station-status" id="now-list"></div></section>
      <section class="console-section"><div class="console-section-head"><span>TFL LINE STATUS</span></div><div class="console-line-list" id="line-status"></div></section>
    </div>
  </aside>

  <main class="console-map" aria-label="Interactive Tube delay map">
    <iframe id="app-map" title="Tubecast interactive map" src="map.html?line=central&amp;console=1&amp;scenario=commute"></iframe>
    <div class="card console-timebar" aria-label="Forecast time">
      <div><b>TIME</b><span id="time-copy">Reported delays now</span></div>
      <div class="console-time-options" role="group" aria-label="Forecast minute">
        <button class="on" data-minute="0"><i class="delay-dot now minor"></i><span>Now</span><small id="time-now">08:43</small></button>
        <button data-minute="10"><i class="delay-dot next minor"></i><span>+10</span></button>
        <button data-minute="20"><i class="delay-dot next minor"></i><span>+20</span></button>
        <button data-minute="30"><i class="delay-dot next minor"></i><span>+30 min</span></button>
      </div>
    </div>
  </main>

  <aside class="card console-panel console-right" aria-live="polite">
    <div class="console-scroll" id="forecast-view">
      <div id="app-ring"></div>
      <section class="console-section"><div class="console-section-head"><span>WHERE IT MAY GET WORSE</span><b id="next-count">0</b></div><p>Predicted station and direction risk</p><div class="station-status" id="next-list"></div></section>
    </div>
    <div class="console-route-panel route-mode" id="route-view" hidden><div class="console-route-pane" id="route-pane"></div></div>
  </aside>
</div>
