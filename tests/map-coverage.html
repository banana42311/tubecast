<!doctype html><meta charset="utf-8"><title>Map coverage regression</title><style>body{background:#1a2029;color:white;font:14px monospace}iframe{width:390px;height:740px}pre{white-space:pre-wrap}</style><pre id="out">Running…</pre><iframe id="app" src="../map.html"></iframe><script>
const frame=document.querySelector('iframe'),logs=[],out=document.querySelector('#out');const wait=ms=>new Promise(r=>setTimeout(r,ms));function check(ok,m){if(!ok)throw Error(m);logs.push('PASS '+m);}
frame.onload=async()=>{try{const w=frame.contentWindow,d=w.document,F=w.FlowMap,C=w.MapCtx;await wait(500);check(F.geo.stations.length===299,'all 299 stations render');check(d.querySelectorAll('.station-base').length===299,'one base marker per station');
for(const name of ['Covent Garden','Monument','Knightsbridge','Reading','Epping','Chesham','Shenfield','Upminster','Morden','Heathrow Terminal 5']){F.openStation(name);await wait(650);const r=d.querySelector('.fsel').getBoundingClientRect();check(r.x>80&&r.x<300&&r.y>150&&r.y<420,name+' is searchable, selectable and can be centered');}
// Exercise the real drag handlers at an outer station, including return movement.
const view=d.querySelector('#view'),start=C.cam.get();for(const [type,x] of [['pointerdown',200],['pointermove',180],['pointermove',70],['pointerup',70]])view.dispatchEvent(new w.PointerEvent(type,{pointerId:31,clientX:x,clientY:250,button:0,bubbles:true}));await wait(650);check(C.cam.get().tx<start.tx-50,'manual pan continues beyond old map boundary');
F.go({t:'pick',from:'reading',field:'to',search:true});await wait(400);const q=d.querySelector('#rpq');q.value='Shenfield';q.dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('[data-n="Shenfield"]').click();check(F.state().from==='reading'&&F.state().to==='shenfield','outer stations usable as route endpoints');
out.textContent='ALL CHECKS PASSED\n'+logs.join('\n');}catch(e){out.textContent=logs.join('\n')+'\nFAIL '+e.stack;}};
</script>
