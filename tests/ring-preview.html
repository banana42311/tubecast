<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tubecast ring fixture preview</title>
<link rel="stylesheet" href="../styles.css?v=20261102-ring1">
<style>
html,body{margin:0;min-height:100%;background:#12161c;color:#fff}body{display:grid;place-items:start center;padding:16px;box-sizing:border-box}.ringcard{position:relative;left:auto;top:auto;margin:0}.preview-label{width:358px;margin:0 0 10px;font:600 12px/16px -apple-system,BlinkMacSystemFont,sans-serif;color:#a9b0bc;letter-spacing:.08em}
</style>
</head>
<body>
<main><p class="preview-label" id="label">SAMPLE STATE</p><div id="mount"></div></main>
<script src="../assets/linemeta.js"></script>
<script src="../assets/lines.js"></script>
<script src="../assets/tfl-network.js"></script>
<script src="../js/state-model.js"></script>
<script src="../js/ring-chart.js?v=20261102-ring1"></script>
<script>
(function(){
  var demo=new URLSearchParams(location.search).get('case')==='demo';
  var source=demo?'../data/demo/commute.json':'../data/state.sample.json';
  document.getElementById('label').textContent=demo?'COMMUTE SCENARIO':'SAMPLE STATE';
  fetch(source).then(function(r){return r.json();}).then(function(data){
    if(demo)data=data.stages[0].state;
    var state=StateModel.transform(data,{},window.TFL_NETWORK||{});state.hasData=true;state.mode=demo?'scenario':'example';
    document.getElementById('mount').innerHTML=RingChart.cardHTML(state);
  });
})();
</script>
</body>
</html>
