<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tubecast ring fixture preview</title>
<link rel="stylesheet" href="../styles.css?v=20261102-ring2">
<style>
html,body{margin:0;min-height:100%;background:#12161c;color:#fff}body{display:block;box-sizing:border-box}main{width:390px;padding-top:16px}.ringcard{position:relative;left:auto;top:auto;margin-left:16px}.preview-label{width:358px;margin:0 0 10px 16px;font:600 12px/16px -apple-system,BlinkMacSystemFont,sans-serif;color:#a9b0bc;letter-spacing:.08em}
</style>
</head>
<body>
<main><p class="preview-label" id="label">SAMPLE STATE</p><div id="mount"></div></main>
<script src="../assets/linemeta.js"></script>
<script src="../assets/lines.js"></script>
<script src="../assets/tfl-network.js"></script>
<script src="../config.js?v=20261102-live3"></script>
<script src="../js/state-model.js"></script>
<script src="../js/ring-chart.js?v=20261102-ring2"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search),type=params.get('case')||'live',demo=type==='demo';
  if(type==='original'){
    document.getElementById('label').textContent='ORIGINAL SVG';
    document.getElementById('mount').innerHTML='<div class="card ringcard"><div class="head"><div class="k">NEXT 30 MINUTES</div><div class="a">Tap a line</div></div><div class="ringwrap"><img src="../assets/ring.svg" alt=""></div><div class="legend"><p>Inner band = now · outer rings = next 30 min. Green normal · amber Minor · red Severe (fainter = less likely) · grey not running</p></div></div>';
    return;
  }
  var source=demo?'../data/demo/commute.json':(type==='live'?(params.get('snapshot')==='1'?'.ring-live-state.json':String((window.TUBECAST_CONFIG||{}).apiBase||'').replace(/\/$/,'')+'/api/state'):'../data/state.sample.json');
  document.getElementById('label').textContent=demo?'COMMUTE SCENARIO':(type==='live'?'LIVE API STATE':'SAMPLE STATE');
  fetch(source).then(function(r){return r.json();}).then(function(data){
    if(demo)data=data.stages[0].state;
    var state=StateModel.transform(data,{},window.TFL_NETWORK||{});state.hasData=true;state.mode=demo?'scenario':(type==='live'?'current':'example');
    document.getElementById('mount').innerHTML=RingChart.cardHTML(state);
  }).catch(function(error){document.getElementById('label').textContent='LOAD FAILED · '+error.message;});
})();
</script>
</body>
</html>
